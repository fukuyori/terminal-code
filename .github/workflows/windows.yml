name: windows

on:
  push:
    branches: [windows-native]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    branches: [windows-native]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm publishes pixel for macOS and Linux only, so its postinstall has no
      # Windows route; pixel is built from the copy in pixel/ below.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pixel/engine/target
          key: pixel-engine-${{ runner.os }}-${{ hashFiles('pixel/engine/Cargo.lock', 'pixel/engine/rust-toolchain.toml') }}

      - name: Build pixel
        run: ./scripts/build-pixel.ps1

      # The types of the electron API come with the Electron download, and tode's
      # typecheck resolves @zenbu-labs/pixel/electron from node_modules.
      - name: Put pixel's electron types where the typecheck looks
        run: |
          New-Item -ItemType Directory -Force node_modules/@zenbu-labs/pixel/electron | Out-Null
          Copy-Item pixel/packages/pixel/electron/electron.d.ts node_modules/@zenbu-labs/pixel/electron/

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: |
          npm run -s build
          node --test --test-timeout=120000 "test/*.test.js"

      # Stages the install the way a release does, without signing, to see that it
      # assembles and that the command runs on the bundled node.exe.
      - name: Stage the install
        run: ./scripts/build-check.ps1 -SkipPixel

      - name: Run the staged command
        run: |
          $version = & out/check/tode/bin/tode.cmd --version
          "tode --version: $version"
          if ($version -ne (Get-Content out/check/tode/VERSION).Trim()) { throw "unexpected version: $version" }
          Get-Content out/check/tode/PIXEL
